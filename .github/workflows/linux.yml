name: Build ColdVoice for Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the Linux build to (leave empty to only build)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/linux-tauri

    steps:
      - uses: actions/checkout@v4

      # Tauri + WebKitGTK, cpal's ALSA headers, and the tools the deb/AppImage
      # bundlers shell out to.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file cmake pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev \
            libasound2-dev libfuse2 desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/linux-tauri/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Offline parity with the Windows installer: whisper.cpp and the base.en
      # model ship inside the package, so dictation works with no account, no
      # key and no network.
      - name: Build whisper.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build /tmp/whisper.cpp/build --config Release -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/native/asr"
          cp /tmp/whisper.cpp/build/bin/whisper-cli "$GITHUB_WORKSPACE/native/asr/whisper-cli"
          chmod +x "$GITHUB_WORKSPACE/native/asr/whisper-cli"

      - name: Fetch the base.en model
        run: |
          mkdir -p "$GITHUB_WORKSPACE/models"
          curl -fL --retry 3 -o "$GITHUB_WORKSPACE/models/ggml-base.en.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          test "$(stat -c%s "$GITHUB_WORKSPACE/models/ggml-base.en.bin")" -gt 100000000

      - name: Generate app icons
        run: npx tauri icon icon.png

      - name: Build the .deb and the AppImage
        run: npx tauri build --bundles deb,appimage

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp src-tauri/target/release/bundle/deb/*.deb "$GITHUB_WORKSPACE/dist/ColdVoice.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$GITHUB_WORKSPACE/dist/ColdVoice.AppImage"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: coldvoice-linux
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" \
            "$GITHUB_WORKSPACE/dist/ColdVoice.deb" \
            "$GITHUB_WORKSPACE/dist/ColdVoice.AppImage" \
            --clobber --repo "$GITHUB_REPOSITORY"
