<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ColdVoice</title>
    <link rel="stylesheet" href="alert.css" />
  </head>
  <body>
    <div class="alert" id="alert" data-kind="disconnect">
      <div class="icon">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" fill="currentColor"/>
          <path d="M6 11a6 6 0 0 0 12 0M12 17v3.5M9 20.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
          <path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="text">
        <div class="title" id="title"></div>
        <div class="message" id="message"></div>
      </div>
      <button class="dismiss" id="dismiss" title="Dismiss">
        <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <script src="bridge.js"></script>
    <script src="alert.js"></script>
  </body>
</html>
