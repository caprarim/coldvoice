<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ColdVoice</title>
    <link rel="stylesheet" href="notice.css" />
  </head>
  <body>
    <div class="notice" id="notice" data-kind="started">
      <div class="accent"></div>
      <div class="icon">
        <svg class="ico-mic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
        <svg class="ico-stop" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5a3 3 0 0 1 6 0v5"/>
          <path d="M15 13.5V12"/>
          <path d="M9 9v3a3 3 0 0 0 5.1 2.1"/>
          <path d="M19 10v2a6.98 6.98 0 0 1-1.4 4.2M5 10v2a7 7 0 0 0 11 5.7"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </div>
      <div class="text">
        <div class="title" id="title">ColdVoice has started dictating</div>
        <div class="message" id="message">Speak now</div>
      </div>
      <div class="pulse" id="pulse">
        <span class="dot"></span>
        <span class="ring"></span>
      </div>
    </div>
    <script src="bridge.js"></script>
    <script src="notice.js"></script>
  </body>
</html>
