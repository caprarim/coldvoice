<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ColdVoice</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <div class="card" id="card" data-mode="view">
      <div class="count" id="count"></div>
      <button class="close" id="close" title="Dismiss" aria-label="Dismiss">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      </button>

      <div class="panel" id="text"></div>
      <textarea class="editor" id="editor" spellcheck="false"></textarea>

      <div class="row row-main">
        <button class="btn primary" id="copy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V5a2 2 0 0 1 2-2h8" />
          </svg>
          <span id="copy-label">Copy</span>
        </button>
        <button class="btn" id="edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20h4L19 9l-4-4L4 16v4Z" />
            <path d="M14 6l4 4" />
          </svg>
          <span>Edit</span>
        </button>
      </div>

      <div class="row row-open">
        <button class="btn" id="open">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 4h6v6" />
            <path d="M20 4 11 13" />
            <path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
          </svg>
          <span>Open ColdVoice</span>
        </button>
      </div>

      <div class="row row-edit">
        <button class="btn primary" id="save">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m5 13 4 4L19 7" />
          </svg>
          <span>Save</span>
        </button>
        <button class="btn" id="cancel"><span>Cancel</span></button>
      </div>

      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <script src="bridge.js"></script>
    <script src="preview.js"></script>
  </body>
</html>
